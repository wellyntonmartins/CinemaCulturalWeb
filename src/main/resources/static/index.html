<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catálogo de filmes e análises do Cinema Cultural.">
    <title>Filmes | Cinema Cultural</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/app.js" defer></script>
    <script src="js/catalogo.js" defer></script>
</head>
<body data-page="catalogo">
<header class="site-header">
    <div class="header-inner">
        <a class="brand" href="index.html"><span class="brand-mark">CC</span><span>Cinema Cultural</span></a>
        <nav class="main-nav" aria-label="Navegação principal">
            <a class="nav-link active" href="index.html">Filmes</a>
            <a class="nav-link" href="analises.html">Análises</a>
        </nav>
        <div class="header-actions">
            <button id="toggle-theme" class="button button-quiet" type="button">Tema escuro</button>
            <a class="button button-primary" href="filme-form.html">+ Novo filme</a>
        </div>
    </div>
</header>
<main class="page-shell">
    <section class="page-heading">
        <div><h1>Filmes</h1><p>Consulte o catálogo, veja os detalhes e leia as análises.</p></div>
        <a class="button button-primary mobile-new" href="filme-form.html">+ Novo filme</a>
    </section>
    <section class="summary-row" aria-label="Resumo do catálogo">
        <span><strong id="stat-filmes">0</strong> filmes</span>
        <span><strong id="stat-analises">0</strong> análises</span>
        <span>Nota média: <strong id="stat-nota">—</strong></span>
    </section>
    <form id="filtro-form" class="filter-bar">
        <label class="search-field"><span class="sr-only">Buscar filme</span><input type="search" id="busca" placeholder="Buscar por título, sinopse ou gênero"></label>
        <label class="filter-field"><span class="sr-only">Filtrar por gênero</span><select id="filtro-genero"><option value="">Todos os gêneros</option></select></label>
        <label class="filter-field"><span class="sr-only">Ordenar filmes</span><select id="ordenacao"><option value="titulo">Título: A–Z</option><option value="ano-desc">Ano: mais recente</option><option value="ano-asc">Ano: mais antigo</option></select></label>
    </form>
    <div class="list-heading"><h2>Catálogo</h2><span id="resultado-contagem" class="muted-text">Carregando filmes...</span></div>
    <div id="lista-filmes" class="film-grid" aria-live="polite"></div>
</main>
<footer class="site-footer"><span>Cinema Cultural © <span class="current-year"></span></span><a href="wireframes/index.html">Wireframes</a></footer>
<div id="toast-area" class="toast-area" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
